<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>Enemy model viewer</title>
<script type="importmap">
  { "imports": { "three": "./js/vendor/three.module.js" } }
</script>
<style>
  body { margin:0; background:#0b0d12; color:#cfd6e4; font:12px ui-monospace,monospace; overflow:hidden; }
  #bar { position:fixed; top:0; left:0; right:0; padding:8px 12px; background:#11141c;
         z-index:2; display:flex; gap:10px; align-items:center; }
  button { background:#222836; color:#cfd6e4; border:1px solid #384154; padding:5px 10px;
           cursor:pointer; font:inherit; }
  button.on { background:#3b82f6; border-color:#3b82f6; color:#fff; }
  #hint { opacity:.6; margin-left:auto; }
  canvas { display:block; }
</style>
</head>
<body>
<div id="bar">
  <button id="prev">&larr;</button>
  <button id="next">&rarr;</button>
  <button id="sil">silhouette</button>
  <button id="spin" class="on">spin</button>
  <button id="face">front</button>
  <button id="q34">3/4</button>
  <button id="side">side</button>
  <button id="near">close range</button>
  <span id="hint">arrows pan &middot; camera is at the player's eye height (1.7m), FOV 75</span>
</div>
<script type="module">
import * as THREE from 'three';
import { ENEMY_TYPES, Enemy } from './js/enemy.js';
import { THEMES, THEME_KEYS, ROLE_KEYS } from './js/themes.js';

// The whole point of this page is to judge silhouettes from where the player
// actually stands. The game is FIRST PERSON: the camera sits at eye height
// 1.7m with pitch 0 and a 75deg FOV (player.js updateCamera, main.js). Viewing
// these from above - the obvious way to lay out a model sheet - foreshortens
// every vertical difference away and makes the entire roster look like blobs,
// which is exactly the bug being fixed. So: eye height, horizontal, one row.
const EYE = 1.7, FOV = 75;
// Wide enough that a 3.2x boss does not overlap its neighbours.
const SPACING = 6.0;
const FAR_Z = 11, NEAR_Z = 5.5;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0b0d12);
const cam = new THREE.PerspectiveCamera(FOV, innerWidth / innerHeight, 0.1, 500);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
document.body.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0x8899bb, 0x202028, 1.0));
const key = new THREE.DirectionalLight(0xffffff, 1.6);
key.position.set(4, 10, 7);
scene.add(key);
const rim = new THREE.DirectionalLight(0x88aaff, 0.7);
rim.position.set(-6, 3, -9);
scene.add(rim);

const floor = new THREE.Mesh(
  new THREE.PlaneGeometry(400, 400),
  new THREE.MeshStandardMaterial({ color: 0x161a24, roughness: 1 })
);
floor.rotation.x = -Math.PI / 2;
scene.add(floor);

// GROUPED BY THEME, IN ROLE ORDER, WITH A GAP BETWEEN BLOCKS.
//
// The test this sheet exists to run is that a type is identifiable as a flat
// black shape. Ten themes add a SECOND test on top of it - that a theme's six
// enemies read as one family - and neither can be run on an alphabetical row.
// Standing a theme's six side by side, in the same role order every time, is
// what makes both answerable at a glance: read across for the family, read
// down the column for the role.
//
// Anything ENEMY_TYPES has that no theme claims - the bosses, and Colossus's
// turret - goes in a last group of its own rather than being dropped, because
// a type this sheet cannot see is a type nobody looks at.
const GROUP_GAP = 1.6;   // in SPACING units, between one theme and the next
const groups = [];
const placed = new Set();
for (const key of THEME_KEYS) {
  const t = THEMES[key];
  const row = [];
  for (const role of ROLE_KEYS) {
    const type = t.roles[role];
    // A slot whose own enemy is not built yet is left EMPTY rather than
    // filled with the RUST type it borrows in game - a row with a chaser
    // standing in it would quietly pass the family test on a theme that has
    // not been drawn.
    if (ENEMY_TYPES[type] && !placed.has(type)) {
      row.push(type);
      placed.add(type);
    } else {
      row.push(null);
    }
  }
  groups.push({ label: t.name, row });
}
const rest = Object.keys(ENEMY_TYPES).filter((k) => !placed.has(k));
if (rest.length) groups.push({ label: 'BOSSES', row: rest });

// Flattened to the (name, x) pairs the loop below wants, with a gap at every
// theme boundary and a hole wherever a slot is not built.
const names = [];
const slots = [];
let col = 0;
for (const g of groups) {
  g.x0 = col;
  for (const type of g.row) {
    if (type) {
      names.push(type);
      slots.push(col);
    }
    col += 1;
  }
  g.x1 = col - 1;
  col += GROUP_GAP;
}
const spinners = [], labels = [], originals = [];
const silMat = new THREE.MeshBasicMaterial({ color: 0x000000 });

names.forEach((name, i) => {
  const e = new Enemy(name, new THREE.Vector3(0, 0, 0), 1, 1, 1);
  const g = e.group;
  // FIELD GEOMETRY IS STRIPPED, whoever it belongs to. An aura drawn at the
  // radius it actually works at is metres across - the warden's dome is
  // thirteen and the hoarfrost's ring fifteen - and in a row spaced six metres
  // apart it does not read as that enemy's aura, it reads as a line through
  // the whole sheet. The MODEL is what is under review here.
  //
  // Done by geometry type rather than by name so the next enemy with a field
  // is covered without an edit: nothing in the roster uses a ring or a sphere
  // as part of its BODY.
  for (const c of [...g.children]) {
    if (c.isMesh && (c.geometry.type === 'SphereGeometry' || c.geometry.type === 'RingGeometry')) {
      g.remove(c);
    }
  }
  // A flier's constructor lifts its group to its hover altitude. This sheet is
  // about the MODEL, and one parked five metres over the row would be off the
  // top of the frame, so every type is stood on the floor here.
  //
  // STOOD ON IT, not dropped to zero. A ground type is authored with its feet
  // at y=0, but a flier is authored around its HOVER POINT - a gargoyle's
  // claws sit at -0.44 and a mothcap's whole body hangs below its cap - so
  // zeroing the group buries them to the waist and puts the name plate through
  // the middle of the model. Measuring the box and lifting by however far it
  // reaches below the floor sits every type on the ground whatever it was
  // authored around, which matters more with each flier that gets added.
  g.position.y = 0;
  g.updateMatrixWorld(true);
  const bounds = new THREE.Box3().setFromObject(g);
  if (Number.isFinite(bounds.min.y) && bounds.min.y < 0) g.position.y = -bounds.min.y;
  const holder = new THREE.Object3D();
  holder.position.x = slots[i] * SPACING;
  holder.add(g);
  scene.add(holder);
  spinners.push(holder);
  // The hit sphere is a real mesh with an invisible material. Swapping it for
  // the black silhouette material would draw a 0.6m ball over the whole model -
  // which is what made every enemy look like a blob in this very test.
  g.traverse(o => {
    if (o.isMesh && o.material.visible !== false) originals.push([o, o.material]);
  });

  const c = document.createElement('canvas');
  c.width = 512; c.height = 96;
  const cx = c.getContext('2d');
  cx.fillStyle = '#ffffff';
  cx.font = 'bold 56px ui-monospace,monospace';
  cx.textAlign = 'center';
  cx.fillText(name.toUpperCase(), 256, 66);
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({
    map: new THREE.CanvasTexture(c), transparent: true, depthTest: false,
  }));
  sp.scale.set(2.6, 0.5, 1);
  sp.position.set(holder.position.x, -0.35, 0);
  scene.add(sp);
  labels.push(sp);
});

// One header per theme, centred over its six columns, so a group is readable
// as a group rather than as six enemies that happen to be next to each other.
const headers = [];
for (const gr of groups) {
  const c = document.createElement('canvas');
  c.width = 1024; c.height = 128;
  const cx = c.getContext('2d');
  cx.fillStyle = '#ffffff';
  cx.font = 'bold 84px ui-monospace,monospace';
  cx.textAlign = 'center';
  cx.fillText(gr.label, 512, 96);
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({
    map: new THREE.CanvasTexture(c), transparent: true, depthTest: false,
  }));
  sp.scale.set(9, 1.1, 1);
  sp.position.set(((gr.x0 + gr.x1) / 2) * SPACING, 3.9, 0);
  scene.add(sp);
  headers.push(sp);
}

let silhouette = false, spinning = true, near = false;
let focus = 0, camX = 0;
// Exposed so the model sheet can be driven from the console while iterating.
window.viewer = {
  go(i) { focus = Math.max(0, Math.min(names.length - 1, i)); camX = slots[focus] * SPACING; },
  names,
};

const btn = (id, fn) => {
  const b = document.getElementById(id);
  b.onclick = () => fn(b);
};
btn('sil', (b) => {
  silhouette = !silhouette;
  b.classList.toggle('on', silhouette);
  for (const [m, orig] of originals) m.material = silhouette ? silMat : orig;
  scene.background = new THREE.Color(silhouette ? 0xe8ecf4 : 0x0b0d12);
  floor.visible = !silhouette;
  for (const l of labels) l.material.color.set(silhouette ? 0x111111 : 0xffffff);
  for (const h of headers) h.material.color.set(silhouette ? 0x111111 : 0xffffff);
});
btn('spin', (b) => { spinning = !spinning; b.classList.toggle('on', spinning); });
// Models face -z, the camera looks down -z, so an unrotated enemy shows its
// BACK. These three park every model at a known bearing instead.
const pose = (a) => () => {
  spinning = false;
  document.getElementById('spin').classList.remove('on');
  for (const h of spinners) h.rotation.y = a;
};
btn('face', pose(Math.PI));
btn('q34', pose(Math.PI * 0.75));
btn('side', pose(Math.PI * 0.5));
btn('near', (b) => { near = !near; b.classList.toggle('on', near); });
btn('prev', () => { focus = Math.max(0, focus - 1); });
btn('next', () => { focus = Math.min(names.length - 1, focus + 1); });
addEventListener('keydown', (ev) => {
  if (ev.key === 'ArrowLeft') focus = Math.max(0, focus - 1);
  if (ev.key === 'ArrowRight') focus = Math.min(names.length - 1, focus + 1);
});
addEventListener('resize', () => {
  cam.aspect = innerWidth / innerHeight;
  cam.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const clock = new THREE.Clock();
function frame() {
  const dt = clock.getDelta();
  if (spinning) for (const h of spinners) h.rotation.y += dt * 0.6;
  camX += (slots[focus] * SPACING - camX) * Math.min(1, dt * 6);
  cam.position.set(camX, EYE, near ? NEAR_Z : FAR_Z);
  cam.lookAt(camX, near ? 1.0 : 0.85, 0);
  renderer.render(scene, cam);
  requestAnimationFrame(frame);
}
frame();
</script>
</body>
</html>
