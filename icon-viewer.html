<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>Icon contact sheet</title>
<script type="importmap">
  { "imports": { "three": "./node_modules/three/build/three.module.js" } }
</script>
<style>
  body { margin:0; background:#0b0d12; color:#cfd6e4; font:12px ui-monospace,monospace; }
  #bar { position:sticky; top:0; padding:8px 12px; background:#11141c; z-index:2;
         display:flex; gap:10px; align-items:center; border-bottom:1px solid #222836; }
  button { background:#222836; color:#cfd6e4; border:1px solid #384154; padding:5px 10px;
           cursor:pointer; font:inherit; }
  button.on { background:#3b82f6; border-color:#3b82f6; color:#fff; }
  #hint { opacity:.6; margin-left:auto; }
  #grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(132px, 1fr)); gap:4px; padding:10px; }
  .cell { background:#12151d; border:1px solid #1e2431; padding:6px 4px 8px; text-align:center; }
  .cell.dupe { border-color:#ff3d00; }
  .cell canvas { display:block; margin:0 auto; }
  .k { color:#8a95b3; margin-top:4px; }
  .n { color:#dfe8ff; font-weight:bold; margin-top:2px; font-size:11px; }
  .unused { opacity:.45; }
</style>
</head>
<body>
<div id="bar">
  <button id="sil">silhouette</button>
  <button id="spin" class="on">spin</button>
  <button id="q34" class="on">3/4</button>
  <span id="hint"></span>
</div>
<div id="grid"></div>
<script type="module">
import * as THREE from 'three';
import { buildIcon, ICON_KEYS } from './js/icons.js';
import { UPGRADES } from './js/upgrades.js';

// A CONTACT SHEET, not a model viewer. Sixty-five icons only have to do one
// job - be told apart from the other sixty-four at a glance - and that is a
// judgement you can only make with all of them on screen at once. Rendering
// them one at a time is how two shapes end up looking alike.
//
// Each cell is its own render of the SAME scene: one renderer, one camera, one
// pair of lights, the icon swapped in and the result blitted into that cell's
// 2D canvas. Sixty-five WebGL contexts would exhaust the browser's limit.
const CELL = 120;
const SCALE = 1.35;   // what totems.js scales an icon to

// Who uses what. Stations and weapons share the catalogue, so they are listed
// here too or their shapes would look unused.
const owner = {};
for (const d of Object.values(UPGRADES)) {
  (owner[d.icon] ||= []).push({ name: d.name, theme: d.theme, devil: !!d.devil });
}
owner.ammoBox ||= [];
owner.ammoBox.push({ name: 'AMMO STATION', theme: 0xffd600 });
owner.gear ||= [];
owner.gear.push({ name: 'REROLL STATION', theme: 0x4ef3ff });
owner.gun ||= [];
owner.gun.push({ name: 'WEAPON OFFER', theme: 0x9fb4d8 });

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(2, devicePixelRatio));
renderer.setSize(CELL, CELL);
renderer.toneMapping = THREE.ACESFilmicToneMapping;

const scene = new THREE.Scene();
// Roughly what the arena gives an icon: a key from above-right and a fill.
scene.add(new THREE.AmbientLight(0xffffff, 0.55));
const key = new THREE.DirectionalLight(0xffffff, 2.0);
key.position.set(3, 5, 4);
scene.add(key);
const fill = new THREE.DirectionalLight(0x88aaff, 0.6);
fill.position.set(-3, 1, 2);
scene.add(fill);

const camera = new THREE.PerspectiveCamera(30, 1, 0.1, 20);
const holder = new THREE.Group();
holder.scale.setScalar(SCALE);
scene.add(holder);

const grid = document.getElementById('grid');
const cells = [];
const keys = ICON_KEYS.slice().sort();

for (const k of keys) {
  const used = owner[k] || [];
  const cell = document.createElement('div');
  cell.className = 'cell' + (used.length > 1 ? ' dupe' : used.length ? '' : ' unused');
  const cv = document.createElement('canvas');
  cv.width = CELL * Math.min(2, devicePixelRatio);
  cv.height = CELL * Math.min(2, devicePixelRatio);
  cv.style.width = cv.style.height = CELL + 'px';
  cell.appendChild(cv);
  const kn = document.createElement('div');
  kn.className = 'k';
  kn.textContent = k;
  cell.appendChild(kn);
  const nn = document.createElement('div');
  nn.className = 'n';
  nn.textContent = used.length ? used.map((u) => (u.devil ? '◆ ' : '') + u.name).join(' + ') : '(unused)';
  if (used.length) nn.style.color = '#' + used[0].theme.toString(16).padStart(6, '0');
  cell.appendChild(nn);
  grid.appendChild(cell);
  cells.push({ k, cv, ctx: cv.getContext('2d'), icon: buildIcon(k, used.length ? used[0].theme : 0x9fb4d8) });
}

document.getElementById('hint').textContent =
  keys.length + ' shapes · red border = shared by two offers · dim = unused';

let spin = true;
let q34 = true;
let sil = false;
const silMat = new THREE.MeshBasicMaterial({ color: 0x000000 });
document.getElementById('spin').onclick = (e) => { spin = !spin; e.target.classList.toggle('on', spin); };
document.getElementById('q34').onclick = (e) => { q34 = !q34; e.target.classList.toggle('on', q34); };
document.getElementById('sil').onclick = (e) => {
  sil = !sil;
  e.target.classList.toggle('on', sil);
  for (const c of cells) {
    c.icon.traverse((o) => {
      if (!o.isMesh) return;
      if (sil) { o.userData._m = o.material; o.material = silMat; }
      else if (o.userData._m) o.material = o.userData._m;
    });
  }
};

function frame(t) {
  const a = spin ? t * 0.0006 : 0;
  for (const c of cells) {
    holder.clear();
    holder.add(c.icon);
    // The icon orbits to face the player in game, so the useful view is the
    // one it presents there: front-on, or a touch off-axis to show depth.
    c.icon.rotation.set(0, (q34 ? 0.6 : 0) + a, 0);
    camera.position.set(0, 0, 2.9);
    camera.lookAt(0, 0, 0);
    renderer.render(scene, camera);
    c.ctx.clearRect(0, 0, c.cv.width, c.cv.height);
    c.ctx.drawImage(renderer.domElement, 0, 0, c.cv.width, c.cv.height);
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
