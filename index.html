<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>VOID ARENA</title>
  <link rel="icon" href="data:,"/>
  <link rel="stylesheet" href="/css/styles.css"/>
  <script type="importmap">
    { "imports": { "three": "./node_modules/three/build/three.module.js" } }
  </script>
</head>
<body>
  <div id="game"></div>

  <div id="hud" class="hidden">
    <div id="hud-top">
      <div id="wave-box">
        <span id="wave-label">WAVE</span>
        <span id="wave-num">1</span>
        <span id="enemies-left">ENEMIES 0</span>
      </div>
      <div id="score-box">
        <span id="score-label">SCORE</span>
        <span id="score-num">0</span>
        <span id="credit-num">$0</span>
      </div>
    </div>
    <div id="boss-bar" class="hidden">
      <div id="boss-name">COLOSSUS</div>
      <div id="boss-hp-bg"><div id="boss-hp"></div></div>
      <div id="boss-note"></div>
    </div>
    <div id="crosshair">
      <i></i><i></i><i></i><i></i>
      <span id="reload-ring" class="hidden"></span>
      <span id="hitmarker"></span>
    </div>
    <!-- Combo gauge. Bottom centre, under the crosshair rather than beside it:
         the multiplier is the one number that changes on every kill, and it was
         unreadable stacked in the top-right corner. Rows are built here; ui.js
         only writes text and two transforms. -->
    <!-- The buff chips live with the combo, not in the corner: both are
         "what is true about you right now", and the eye is already on the
         multiplier. -->
    <div id="buffs"></div>
    <div id="combo" class="hidden">
      <div id="combo-head">
        <span id="combo-mult">x1.0</span>
        <span id="combo-count">0 KILLS</span>
      </div>
      <div id="combo-gauge">
        <i id="combo-fill"></i>
        <span class="combo-tick" style="left:33.33%"></span>
        <span class="combo-tick" style="left:66.66%"></span>
      </div>
      <div id="combo-bar"><i></i></div>
    </div>
    <div id="hud-bottom">
      <div id="hp-box">
        <div id="hp-bar-bg"><div id="hp-bar"></div></div>
        <div id="hp-text">100 / 100</div>
      </div>
      <div id="ammo-box">
        <span id="ammo-reload" class="hidden">RELOADING</span>
        <div id="weapon-line">
          <span id="weapon-name">PULSE RIFLE</span>
        </div>
        <div id="ammo-line">
          <span id="ammo-num">30</span>
          <span id="ammo-res">/ 30</span>
        </div>
      </div>
    </div>
  </div>



  <div id="strobe"></div>
  <div id="vignette"></div>
  <div id="banner"></div>

  <div id="prompt" class="hidden"></div>

  <!-- Held-TAB build sheet. Rows are built by ui.js; the shell is here so the
       card and its two columns are styled once and never rebuilt. -->
  <div id="stats-panel" class="hidden">
    <div id="stats-card">
      <div class="stats-head">RUN SUMMARY &nbsp;·&nbsp; HOLD TAB</div>
      <div class="stats-col muts">
        <h3>MUTATIONS</h3>
        <div id="stats-muts"></div>
      </div>
      <div class="stats-col">
        <h3>RUN</h3>
        <div id="stats-run"></div>
      </div>
    </div>
  </div>

  <div id="overlay-start" class="overlay">
    <h1>VOID ARENA</h1>
    <p class="sub">SURVIVE THE WAVES</p>
    <div class="controls">
      <b>WASD</b> MOVE  ·  <b>MOUSE</b> AIM  ·  <b>LMB</b> SHOOT  ·  <b>RMB</b> MELEE  ·  <b>R</b> RELOAD<br/>
      <b>SPACE</b> JUMP  ·  <b>E</b> USE  ·  <b>TAB</b> STATS  ·  <b>F</b> FULLSCREEN
    </div>
    <div id="lb-start" class="lb"></div>
    <button id="btn-start">CLICK TO START</button>
    <div class="opt-row">
      <button id="btn-mute-start" class="opt-btn mute-btn">MUSIC ON</button>
      <button id="btn-fs-start" class="opt-btn">FULLSCREEN</button>
    </div>
  </div>

  <div id="overlay-over" class="overlay hidden">
    <h1 class="dead">YOU DIED</h1>
    <p class="sub" id="over-stats"></p>
    <!-- Shown only when the run places in the top ten. -->
    <div id="lb-entry" class="hidden">
      <label for="lb-name">NEW HIGH SCORE &nbsp;·&nbsp; ENTER NAME</label>
      <div class="lb-entry-row">
        <input id="lb-name" type="text" maxlength="12" autocomplete="off" spellcheck="false"/>
        <button id="btn-lb-save">SAVE</button>
      </div>
    </div>
    <div id="lb-over" class="lb"></div>
    <button id="btn-restart">RESTART</button>
  </div>

  <div id="overlay-pause" class="overlay hidden">
    <h1>PAUSED</h1>
    <button id="btn-resume">CLICK TO RESUME</button>
    <div class="opt-row">
      <button id="btn-mute-pause" class="opt-btn mute-btn">MUSIC ON</button>
      <button id="btn-fs-pause" class="opt-btn">FULLSCREEN</button>
    </div>
  </div>

  <script type="module" src="/js/main.js"></script>
</body>
</html>
