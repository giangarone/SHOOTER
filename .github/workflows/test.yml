name: tests

on:
  push:
    branches: [main]
  pull_request:
  # So /oc (and anyone else) can kick the suite off by hand against a branch.
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    # SHARDED, because a runner has no GPU. The game rasterizes every frame in
    # software on a shared vCPU, which makes these suites roughly five times
    # slower here than on a developer machine - not any one of them hanging,
    # just thirty of them being slow. Four runners in parallel turns a
    # two-hour serial job into a thirty-minute one.
    #
    # test/all.mjs balances the split by weight, so the four shards finish at
    # about the same time rather than one carrying every long suite.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    name: test (shard ${{ matrix.shard }}/4)
    # Generous, because it should never be what stops a run - the per-suite cap
    # below is the real limit, and it names the suite that hung. The whole
    # sharded run is ~30 minutes.
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # puppeteer-core ships no browser of its own, so one has to be put on the
      # runner and its path handed to the tests. test/harness.mjs also probes
      # the usual Linux locations, but the action's own output is exact.
      - uses: browser-actions/setup-chrome@v1
        id: chrome
        with:
          chrome-version: stable

      - name: Run the full suite
        env:
          CHROME: ${{ steps.chrome.outputs.chrome-path }}
          SHARD: ${{ matrix.shard }}/4
          # Suites that take 90s on a developer machine can take past 300s
          # here. This is a hang detector, not a performance budget.
          TIMEOUT: 900
        run: npm run test:all
