name: tests

on:
  push:
    branches: [main]
  pull_request:
  # So /oc (and anyone else) can kick the suite off by hand against a branch.
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    # The whole suite is ~30 headless-Chrome runs, one at a time. The per-suite
    # cap in test/all.mjs is what should normally fire; this is the backstop.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # puppeteer-core ships no browser of its own, so one has to be put on the
      # runner and its path handed to the tests. test/harness.mjs also probes
      # the usual Linux locations, but the action's own output is exact.
      - uses: browser-actions/setup-chrome@v1
        id: chrome
        with:
          chrome-version: stable

      - name: Run the full suite
        env:
          CHROME: ${{ steps.chrome.outputs.chrome-path }}
        run: npm run test:all
