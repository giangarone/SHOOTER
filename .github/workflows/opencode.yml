name: opencode

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  opencode:
    if: |
      (
        github.event.comment.user.login == 'giangarone' ||
        github.event.comment.user.login == 'tomitomano'
      ) &&
      (
        contains(github.event.comment.body, ' /oc') ||
        startsWith(github.event.comment.body, '/oc') ||
        contains(github.event.comment.body, ' /opencode') ||
        startsWith(github.event.comment.body, '/opencode')
      )

    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write
      issues: write
      # Lets the job mint an OIDC token, which the action trades for an
      # opencode GitHub App token. That token is what makes the PRs it opens
      # trigger `tests` on their own - a PR opened with GITHUB_TOKEN instead
      # lands the run in "awaiting approval" and sits there until a human
      # clicks it.
      id-token: write

    steps:
      # persist-credentials is OFF because opencode brings its own credentials
      # now. Both it and checkout write the SAME git config key,
      # http.https://github.com/.extraheader, and git keeps a repeated key as
      # multi-valued rather than overwriting - so the push went out carrying
      # two Authorization headers and GitHub rejected it outright:
      # `remote: Duplicate header: "Authorization"`, 400, after committing, so
      # the work was already done and then lost.
      #
      # This was the opposite way round under `use_github_token: true`: back
      # then opencode had no credentials of its own and pushed on the ones
      # checkout left behind, so turning the flag off broke the push instead.
      # Dropping that input (to stop PRs landing in "awaiting approval") is
      # what flipped this.
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      # Everything below exists so that the agent can actually RUN the test
      # suite when it is asked to. Without node modules and a browser on the
      # runner, every one of the ~30 puppeteer suites fails at launch and the
      # agent has no way to check its own work.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - uses: browser-actions/setup-chrome@v1
        id: chrome
        with:
          chrome-version: stable

      # A runner is a fresh machine with no git identity, and a commit cannot
      # be made without one - the agent got as far as staging its work and then
      # died on "Author identity unknown", losing the change. Attributed to the
      # agent rather than to a person on purpose: git log and git blame should
      # say plainly which commits were written by an agent.
      - name: Set git identity for the agent
        run: |
          git config --global user.name "opencode-agent"
          git config --global user.email "opencode-agent@users.noreply.github.com"

      - name: Run opencode
        uses: anomalyco/opencode/github@latest
        env:
          TOKENROUTER_API_KEY: ${{ secrets.TOKENROUTER_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENCODE_EXPERIMENTAL_OUTPUT_TOKEN_MAX: "131072"
          # test/harness.mjs reads this; without it the tests fall back to
          # probing /usr/bin, which the setup-chrome action does not populate.
          CHROME: ${{ steps.chrome.outputs.chrome-path }}
        with:
          model: tokenrouter/z-ai/glm-5.3-free
          variant: max