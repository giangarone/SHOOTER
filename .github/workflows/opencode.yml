name: opencode

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      continuation:
        description: Internal flag used by the automatic OpenCode continuation chain
        required: false
        default: "false"
        type: string
      previous_run_id:
        description: Previous workflow run containing the OpenCode checkpoint
        required: false
        default: ""
        type: string
      chunk:
        description: Continuation chunk number
        required: false
        default: "1"
        type: string

env:
  MODEL: tokenrouter/z-ai/glm-5.3-free
  VARIANT: max
  OPENCODE_EXPERIMENTAL_OUTPUT_TOKEN_MAX: "131072"
  CHUNK_MINUTES: "310"

jobs:
  initial:
    if: |
      github.event_name != 'workflow_dispatch' &&
      (
        github.event.comment.user.login == 'giangarone' ||
        github.event.comment.user.login == 'tomitomano'
      ) &&
      (
        contains(github.event.comment.body, ' /oc') ||
        startsWith(github.event.comment.body, '/oc') ||
        contains(github.event.comment.body, ' /opencode') ||
        startsWith(github.event.comment.body, '/opencode')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 350
    permissions:
      actions: write
      contents: write
      pull-requests: write
      issues: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      # Copy the trusted helper out of the worktree before OpenCode can edit it.
      - name: Copy continuation helper
        run: cp .github/scripts/opencode-chunk.sh "$RUNNER_TEMP/opencode-chunk.sh"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - uses: browser-actions/setup-chrome@v1
        id: chrome
        with:
          chrome-version: stable

      - name: Set git identity for the agent
        run: |
          git config --global user.name "opencode-agent"
          git config --global user.email "opencode-agent@users.noreply.github.com"

      - name: Run OpenCode (first chunk)
        id: agent
        env:
          TOKENROUTER_API_KEY: ${{ secrets.TOKENROUTER_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHROME: ${{ steps.chrome.outputs.chrome-path }}
          STATE_DIR: ${{ runner.temp }}/opencode-state
        run: bash "$RUNNER_TEMP/opencode-chunk.sh" initial

      - name: Upload checkpoint
        if: steps.agent.outputs.state == 'continue'
        uses: actions/upload-artifact@v4
        with:
          name: opencode-state
          path: ${{ runner.temp }}/opencode-state
          retention-days: 1
          if-no-files-found: error

      - name: Start next OpenCode chunk
        if: steps.agent.outputs.state == 'continue'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          payload=$(jq -n \
            --arg ref "${{ github.event.repository.default_branch }}" \
            --arg previous_run_id "${GITHUB_RUN_ID}" \
            '{ref:$ref, inputs:{continuation:"true", previous_run_id:$previous_run_id, chunk:"2"}}')

          curl -fsSL -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/opencode.yml/dispatches" \
            -d "$payload"

  continuation:
    if: github.event_name == 'workflow_dispatch' && inputs.continuation == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    permissions:
      actions: write
      contents: read

    outputs:
      state: ${{ steps.agent.outputs.state }}

    steps:
      # Checkout only to obtain the trusted helper from main/default branch.
      - name: Checkout trusted workflow files
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Copy continuation helper
        run: cp .github/scripts/opencode-chunk.sh "$RUNNER_TEMP/opencode-chunk.sh"

      - name: Download previous checkpoint
        uses: actions/download-artifact@v5
        with:
          name: opencode-state
          path: ${{ runner.temp }}/opencode-state
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.previous_run_id }}

      - name: Restore OpenCode workspace and session
        run: |
          find "$GITHUB_WORKSPACE" -mindepth 1 -maxdepth 1 -exec rm -rf {} +
          tar -xzf "$RUNNER_TEMP/opencode-state/workspace.tar.gz" -C "$GITHUB_WORKSPACE"

          if [ -f "$RUNNER_TEMP/opencode-state/opencode-data.tar.gz" ]; then
            tar -xzf "$RUNNER_TEMP/opencode-state/opencode-data.tar.gz" -C "$HOME"
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Secrets are NOT exposed to this step.
      - run: npm ci

      - uses: browser-actions/setup-chrome@v1
        id: chrome
        with:
          chrome-version: stable

      - name: Set git identity for the agent
        run: |
          git config --global user.name "opencode-agent"
          git config --global user.email "opencode-agent@users.noreply.github.com"

      - name: Continue the same OpenCode session
        id: agent
        env:
          TOKENROUTER_API_KEY: ${{ secrets.TOKENROUTER_API_KEY }}
          CHROME: ${{ steps.chrome.outputs.chrome-path }}
          STATE_DIR: ${{ runner.temp }}/opencode-state
        run: bash "$RUNNER_TEMP/opencode-chunk.sh" continue

      - name: Upload new state
        uses: actions/upload-artifact@v4
        with:
          name: opencode-state
          path: ${{ runner.temp }}/opencode-state
          retention-days: 1
          if-no-files-found: error

      - name: Start another OpenCode chunk
        if: steps.agent.outputs.state == 'continue'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CURRENT_CHUNK: ${{ inputs.chunk }}
        run: |
          next_chunk=$((CURRENT_CHUNK + 1))
          payload=$(jq -n \
            --arg ref "${{ github.event.repository.default_branch }}" \
            --arg previous_run_id "${GITHUB_RUN_ID}" \
            --arg chunk "$next_chunk" \
            '{ref:$ref, inputs:{continuation:"true", previous_run_id:$previous_run_id, chunk:$chunk}}')

          curl -fsSL -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/opencode.yml/dispatches" \
            -d "$payload"

  finalize:
    needs: continuation
    if: needs.continuation.outputs.state == 'finished'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: write
      pull-requests: write
      issues: write
      id-token: write

    steps:
      # Again, obtain a trusted copy of the helper before restoring agent files.
      - name: Checkout trusted workflow files
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Copy finalizer helper
        run: cp .github/scripts/opencode-chunk.sh "$RUNNER_TEMP/opencode-chunk.sh"

      - name: Download completed state
        uses: actions/download-artifact@v5
        with:
          name: opencode-state
          path: ${{ runner.temp }}/opencode-state

      - name: Restore completed workspace
        run: |
          find "$GITHUB_WORKSPACE" -mindepth 1 -maxdepth 1 -exec rm -rf {} +
          tar -xzf "$RUNNER_TEMP/opencode-state/workspace.tar.gz" -C "$GITHUB_WORKSPACE"

      - name: Set git identity for the agent
        run: |
          git config --global user.name "opencode-agent"
          git config --global user.email "opencode-agent@users.noreply.github.com"

      - name: Push changes and post final result
        env:
          STATE_DIR: ${{ runner.temp }}/opencode-state
        run: bash "$RUNNER_TEMP/opencode-chunk.sh" finalize
